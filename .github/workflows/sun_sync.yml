name: 8x64 Sliding Sun Engine

on:
  workflow_dispatch:      
  repository_dispatch:    
    types: [trigger-weather]

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Sky Engine Script
        env:
          METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USER: ${{ secrets.HIVEMQ_USERNAME }}
          MQTT_PASS: ${{ secrets.HIVEMQ_password }}
          WLED_MQTT_TOPIC: ${{ secrets.WLED_MQTT_TOPIC }}
        run: python main.py
